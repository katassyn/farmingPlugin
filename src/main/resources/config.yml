# Farming Plugin Configuration

# Database settings
database:
  host: localhost
  port: 3306
  name: plantation
  user: root
  password: ""
  
  # HikariCP connection pool settings
  hikari:
    # Maximum number of connections in the pool
    maximum_pool_size: 5
    
    # Minimum number of idle connections to maintain
    minimum_idle: 2
    
    # Connection timeout in milliseconds (10 seconds)
    connection_timeout: 10000
    
    # Idle timeout in milliseconds (5 minutes)
    idle_timeout: 300000
    
    # Maximum lifetime of a connection in milliseconds (15 minutes)
    max_lifetime: 900000
    
    # Connection leak detection threshold in milliseconds (30 seconds)
    leak_detection_threshold: 30000

# Economy settings
# Economy settings
economy:
  enabled: true
npc:
  enabled: true
  temporary_permission_command: "npcmd add plantation.use plantation"
# Teleportation settings
teleport:
  require_level: true
  minimum_level: 85
  cooldown_seconds: 5
  require_permission: true
  permission: "plantation.use"

plantations:
  world: world
  base:
    origin:
      x: 1000
      y: 100
      z: 1000
    plot:
      width: 17
      depth: 15
      fence_material: OAK_FENCE
    spacing: 20
    grid:
      rows: 10
      cols: 10
  # Protection settings
  protection:
    block_build: true
    block_pvp: false
    block_farm_blocks: true
  # Hologram settings
  holograms:
    # Enable or disable the hologram system
    enabled: true
    
    # Y-offset for holograms above farm blocks
    # Recommended values: 1.0 - 2.5 (adjust based on your preference)
    y_offset: 1.5
    
    # Update interval in ticks (20 ticks = 1 second)
    # Lower values = more frequent updates but higher server load
    update_interval: 100  # 5 seconds
    
    # Cleanup interval in ticks for removing orphaned armor stands
    cleanup_interval: 600  # 30 seconds
    
    # Maximum distance from farm to show hologram (in blocks)
    view_distance: 32
    
    # Show progress bar for growing farms
    show_progress_bar: true
    
    # Show efficiency and quality bonuses
    show_upgrades: true
    
    # Blink effect for ready farms
    ready_blink: true
    
    # Colors (use Minecraft color codes)
    colors:
      title: "&e&l"          # Yellow bold for farm name
      ready: "&a&l"          # Green bold for ready status
      timer: "&6"            # Gold for timer
      storage_low: "&a"      # Green when storage is low
      storage_medium: "&e"   # Yellow when storage is filling
      storage_full: "&c"     # Red when storage is full
      progress_filled: "&a"  # Green for filled progress
      progress_empty: "&7"   # Gray for empty progress
      
    # Line spacing (distance between text lines)
    line_spacing: 0.23
    
    # Animation settings
    animations:
      # Floating text animation for harvests
      harvest_text:
        enabled: true
        duration_ms: 2500
        rise_speed: 0.03
        
      # Level up animation
      level_up:
        enabled: true
        duration_ms: 3500
        particle_count: 50
    
    # Performance settings
    performance:
      # Remove holograms when player is far away
      remove_when_far: true
      
      # Distance to remove holograms (blocks)
      far_distance: 50
      
      # Cache armor stands for better performance
      use_cache: true
      
      # Batch updates to reduce lag
      batch_updates: true
      
    # Debug settings
    debug:
      # Show debug messages in console
      show_messages: false
      
      # Show hologram count in debug
      show_count: true
      
      # Log hologram creation/removal
      log_lifecycle: false
  # Drop settings
  drop:
    radius: 0.6

fruits:
  sweet_berries:
    display_name: "&dSweet Berries"
    sell_price: 50000
  golden_melon:
    display_name: "&6Golden Melon Slice"
    sell_price: 75000
  mystic_mushroom:
    display_name: "&5Mystic Mushroom"
    sell_price: 100000
  enchanted_pumpkin:
    display_name: "&6Enchanted Pumpkin Slice"
    sell_price: 125000
  ethereal_flower:
    display_name: "&dEthereal Blossom"
    sell_price: 200000
  ancient_seed:
    display_name: "&2Ancient Mangrove Seed"
    sell_price: 350000
  desert_date:
    display_name: "&eDesert Golden Date"
    sell_price: 500000

# Starter kit for new players
starter_kit:
  enabled: false

# Auto-save settings
auto_save:
  enabled: true
  interval_minutes: 5

# Metrics
metrics:
  enabled: true

# Debug mode - shows detailed information about material checking
debug: false

# Pouch integration settings
pouch_integration:
  enabled: true
  # If true, will check both inventory and pouch for materials
  check_both: true
  # If true, will prefer taking materials from inventory before pouch
  prefer_inventory: true

# --- PLANTATION LAYOUT & WORLD ---
plantation:
  world: world
  spawn:
    x: 1008
    y: 64
    z: 998
  rebuild_on_join: true

# --- TEST MODE ---
test_mode:
  enabled: true
  growth_minutes: 1

# (optional) materials for crops/paths
blocks:
  path: DIRT_PATH
  ground: GRASS_BLOCK
